<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================================
   HEAD SECTION
  ========================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media | Erkhes Portfolio</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope&family=Poiret+One&family=Roboto&display=swap" rel="stylesheet">
</head>

<body>

  <!-- =========================================
   HEADER
  ========================================= -->
  <header class="site-header">
    <div class="container nav-bar">
      <div class="site-title">Erkhes Portfolio</div>

      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="media.html" aria-current="page">Media</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- =========================================
   MAIN CONTENT
  ========================================= -->
  <main class="container">

    <!-- title -->
    <section style="padding-top: 40px;">
      <h1>Media</h1>
      <p>This page loads quotes from an API when the button is clicked.</p>
    </section>

    <!-- button -->
    <section style="padding-top: 20px;">
      <button id="loadBtn">Load Quotes</button>

      <p id="loadingMessage" style="display:none;">Loading...</p>
      <p id="errorMessage" style="color:red;"></p>
    </section>

    <!-- results -->
    <section style="padding-top: 20px; padding-bottom: 40px;">
      <div id="dataContainer"></div>
    </section>

  </main>

  <!-- =========================================
   FOOTER
  ========================================= -->
  <footer class="site-footer">
    <p>&copy; Erkhes Otgontsetseg 2026</p>
  </footer>

  <!-- =========================================
   SCRIPT (API)
  ========================================= -->
  <script>
    async function loadData() {
      const loadingMessage = document.getElementById("loadingMessage");
      const errorMessage = document.getElementById("errorMessage");
      const dataContainer = document.getElementById("dataContainer");

      loadingMessage.style.display = "block";
      errorMessage.textContent = "";
      dataContainer.innerHTML = "";

      try {
        const response = await fetch("https://dummyjson.com/quotes?limit=5");

        if (!response.ok) {
          throw new Error("Failed to fetch");
        }

        const data = await response.json();

        data.quotes.forEach(function(q) {
          const item = document.createElement("div");

          const quote = document.createElement("p");
          quote.textContent = '"' + q.quote + '"';

          const author = document.createElement("strong");
          author.textContent = "- " + q.author;

          item.appendChild(quote);
          item.appendChild(author);

          dataContainer.appendChild(item);
        });

      } catch (error) {
        errorMessage.textContent = "Something went wrong. Please try again.";
      } finally {
        loadingMessage.style.display = "none";
      }
    }

    document.getElementById("loadBtn").addEventListener("click", loadData);
  </script>

</body>
</html>
