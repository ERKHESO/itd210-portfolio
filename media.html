<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erkhes Portfolio API</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px;
      margin: 10px 0;
      cursor: pointer;
    }

    #dataContainer div {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
    }

    #errorMessage {
      color: red;
    }
  </style>
</head>

<body>

  <h1>Erkhes Portfolio - API Section</h1>

  <!-- Step 5: Button to load data -->
  <button id="loadBtn">Load Quotes</button>

  <!-- Step 3: Loading + Error -->
  <p id="loadingMessage" style="display:none;">Loading...</p>
  <p id="errorMessage"></p>

  <!-- Step 4: Data will show here -->
  <div id="dataContainer"></div>

  <script>
    async function loadData() {
      const loadingMessage = document.getElementById("loadingMessage");
      const errorMessage = document.getElementById("errorMessage");
      const dataContainer = document.getElementById("dataContainer");

      // show loading
      loadingMessage.style.display = "block";
      errorMessage.textContent = "";
      dataContainer.innerHTML = "";

      try {
        // fetch data from API
        const response = await fetch("https://dummyjson.com/quotes?limit=5");

        // check if response is ok
        if (!response.ok) {
          throw new Error("Failed to fetch data");
        }

        // convert to JSON
        const data = await response.json();

        // display data
        data.quotes.forEach(q => {
          const item = document.createElement("div");
          item.innerHTML = `
            <p>"${q.quote}"</p>
            <strong>- ${q.author}</strong>
          `;
          dataContainer.appendChild(item);
        });

      } catch (error) {
        // show error message
        errorMessage.textContent = "Something went wrong. Please try again.";
      } finally {
        // hide loading
        loadingMessage.style.display = "none";
      }
    }

    // button click
    document.getElementById("loadBtn").addEventListener("click", loadData);
  </script>

</body>
</html>
