<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erkhes Portfolio</title>

<link rel="stylesheet" href="css/custom.css" />
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope&family=Poiret+One&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>

<!-- Navbar -->
<div class="w3-top w3-white">
  <div class="w3-auto w3-bar w3-padding" style="max-width: 1500px">
    Erkhes Portfolio
    <div class="w3-right">
      <a href="index.html" class="w3-button">Home</a>
      <a href="about.html" class="w3-button">About</a>
      <a href="gallery.html" class="w3-button">Gallery</a>
      <a href="media.html" class="w3-button">Media</a>
      <a href="contact.html" class="w3-button">Contact</a>
    </div>
  </div>
</div>

<!-- API SECTION ONLY -->
<main class="w3-content w3-padding-64" style="max-width:1500px; margin-top:80px;">

  <h2>Live Quotes</h2>

  <!-- Button -->
  <button id="loadBtn" class="w3-button w3-black w3-margin-bottom">
    Load Quotes
  </button>

  <!-- Loading + Error -->
  <p id="loadingMessage" style="display:none;">Loading...</p>
  <p id="errorMessage" style="color:red;"></p>

  <!-- Data -->
  <div id="dataContainer" class="w3-row-padding"></div>

</main>

<script>
  async function loadData() {
    const loadingMessage = document.getElementById("loadingMessage");
    const errorMessage = document.getElementById("errorMessage");
    const dataContainer = document.getElementById("dataContainer");

    // show loading
    loadingMessage.style.display = "block";
    errorMessage.textContent = "";
    dataContainer.innerHTML = "";

    try {
      // fetch quotes
      const response = await fetch("https://dummyjson.com/quotes?limit=5");

      if (!response.ok) {
        throw new Error("Failed to fetch");
      }

      const data = await response.json();

      // display quotes safely
      data.quotes.forEach(q => {
        const item = document.createElement("div");
        item.className = "w3-col l3 m6 w3-margin-bottom";

        const box = document.createElement("div");
        box.className = "w3-padding w3-light-grey";

        const quote = document.createElement("p");
        quote.textContent = `"${q.quote}"`;

        const author = document.createElement("strong");
        author.textContent = `- ${q.author}`;

        box.appendChild(quote);
        box.appendChild(author);
        item.appendChild(box);

        dataContainer.appendChild(item);
      });

    } catch (error) {
      errorMessage.textContent = "Something went wrong. Please try again.";
    } finally {
      loadingMessage.style.display = "none";
    }
  }

  document.getElementById("loadBtn").addEventListener("click", loadData);
</script>

<!-- Footer -->
<footer class="w3-center w3-black w3-padding-16">
  <p>&copy; Erkhes Otgontsetseg 2026</p>
</footer>

</body>
</html>
